# Garde la base Supabase de la MDL active (offre gratuite = pause après 7 jours).
# Tourne sur les serveurs de GitHub, gratuitement, tout seul.
#
# OÙ LE METTRE : dans ton dépôt GitHub, au chemin exact :
#   .github/workflows/keep-supabase-alive.yml
#
name: Garder la base Supabase active

on:
  schedule:
    - cron: "0 8 * * 1,4"   # lundi et jeudi à 08h00 (UTC) — 2x/semaine, marge de sécurité
  workflow_dispatch:         # bouton "Run workflow" pour tester à la main

permissions:
  contents: write            # autorise la tâche à écrire la trace d'activité

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ping de la base MDL
        run: |
          curl -sS -o /dev/null -w "Ping OK (code HTTP %{http_code})\n" \
            "https://ksvqjbcnqphnyxfpjhvz.supabase.co/rest/v1/articles?select=id&limit=1" \
            -H "apikey: sb_publishable_KJntHDOzJXgogIKxXNvWDg_p65OruJ0" \
            -H "Authorization: Bearer sb_publishable_KJntHDOzJXgogIKxXNvWDg_p65OruJ0"

      - name: Marquer l'activité du dépôt (anti-désactivation 60 jours)
        run: |
          date -u +"Dernier ping de maintien : %Y-%m-%d %H:%M UTC" > derniere-activite.txt
          git config user.name "mdl-bot"
          git config user.email "actions@github.com"
          git add derniere-activite.txt
          git commit -m "keep-alive: ping base + activite depot" || echo "Rien a committer"
          git push
